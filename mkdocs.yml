site_name: Tech Notes
theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
extra_javascript:
  - javascripts/marks.js
extra_css:
  - stylesheets/marks.css
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
exclude_docs: |
  superpowers/
nav:
  - 기술 스택:
      - stack/index.md
      - 오케스트레이션:
          - stack/orchestration/airflow.md
      - 처리·스트리밍:
          - stack/processing/spark.md
          - stack/processing/kafka.md
      - 메시징·캐시:
          - stack/messaging/rabbitmq-redis.md
      - 저장소:
          - stack/storage/postgresql.md
          - stack/storage/mongodb.md
          - stack/storage/elasticsearch.md
          - stack/storage/s3-hive-parquet.md
      - 데이터 모델링:
          - stack/modeling/etl-elt-layers.md
          - stack/modeling/dim-fact-scd.md
      - 수집:
          - stack/ingestion/scraping.md
      - 서빙:
          - stack/serving/fastapi-django.md
          - stack/serving/streamlit-sqlalchemy-pydantic.md
      - 인프라:
          - stack/infra/docker.md
          - stack/infra/kubernetes.md
          - stack/infra/kibana.md
          - stack/infra/github-actions.md
      - 문서 처리:
          - stack/docs/pdf-html-tables.md
      - LLM · RAG:
          - stack/llm/langchain-langgraph.md
          - stack/llm/embeddings.md
          - stack/llm/chunking.md
          - stack/llm/hybrid-search.md
          - stack/llm/rag-evaluation.md
          - stack/llm/nl2sql.md
          - stack/llm/vlm.md
          - stack/llm/llm-apis.md
  - 학습 워크플로우: learn/index.md
  - 내 프로젝트: projects/index.md
  - 예상질문:
      - interview/index.md
      - interview/orchestration.md
      - interview/processing-streaming.md
      - interview/storage.md
      - interview/modeling.md
      - interview/ingestion.md
      - interview/serving-infra.md
      - interview/llm-rag.md
      - interview/agent.md
